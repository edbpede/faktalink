# The test tier: the extractor unit suite, the JS bundle budget, and the
# Playwright end-to-end run.
#
# The extractor is the one piece of logic both entry paths depend on — the
# build-time crawler and the browser paste-HTML fallback — so its unit suite
# gates every push. The bundle budget is the brief's hard 50 KB limit on an emne
# page, asserted here rather than checked by hand.
#
# Formatting, hooks, types and the plain build live in code-quality.yml, and
# route loading in smoke.yml. Nothing is duplicated here.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit · bundle budget · end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Derived from the committed `packageManager` field, not `latest`.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bunfig.toml` scopes `bun test` to src/; the Playwright specs under e2e/
      # import @playwright/test and cannot run under bun:test, so they have
      # their own runner below.
      - name: Unit tests
        run: bun test

      # The bundle budget measures the built output, so the build comes first.
      # The Playwright config builds nothing — it only serves dist/ — so this
      # build is what both the budget check and the e2e suite run against.
      - name: Build
        run: bun run build

      # An emne page must ship under 50 KB of JS before any video is clicked.
      # The Svelte runtime alone is ~35 KB, so the headroom is genuinely thin
      # and worth gating rather than trusting.
      - name: Bundle budget
        run: bun run check:bundle

      - name: Install browsers
        run: bunx --bun playwright install --with-deps chromium

      # playwright.config.ts starts `scripts/serve-dist.ts` against the dist/
      # built above, so the suite always runs on the real static output rather
      # than a dev server.
      - name: End-to-end tests
        run: bun run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
