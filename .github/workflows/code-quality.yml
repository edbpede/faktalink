name: Code quality

# The same hook set that runs locally. `prek run --all-files --group ci` is the
# single entry point, so a green local commit and a green pipeline mean the same
# thing rather than two different standards.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans history, so it needs more than the tip commit.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: j178/prek-action@v3
        with:
          # The `ci` group is the union of the commit-time hooks and the slow
          # ones (type-check, tests, build) that are pre-push or manual locally.
          extra_args: --all-files --group ci

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx --bun playwright install --with-deps chromium

      # The suite runs against the real static build, so it must exist first.
      - name: Build the site
        run: bun run build

      - name: Run Playwright
        run: bunx --bun playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
